[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-based"
version = "0.1.0"
description = "Ontology-grounded knowledge graph construction API using Wikidata MCP and Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "Flask==3.0.0",
    "python-dotenv==1.0.1",
    "rdflib==7.1.1",
    "requests==2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pyright>=1.1.400,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
ontology-based = "ontology_based.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-runtime"
norecursedirs = [".git", ".pytest_cache", ".pytest-runtime", ".tmp", "tests-tmp*"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".pytest-runtime"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
